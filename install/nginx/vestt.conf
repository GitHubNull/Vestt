# =============================================================================
# Vestt 分离部署 nginx 配置（doc/tech/architecture.md §7.1 形态 B）
#
# 形态 B：nginx 托管前端静态资源，未命中静态文件的请求一律反代后端。
# 后端单二进制照常运行（其内嵌前端产物作为回退），同域反代无需启用 allow_cors：
#   /opt/vestt/vestt --port 9117 --data-dir /var/lib/vestt
#
# 前端静态包解包位置约定（release 产物 vestt-web-v<ver>.tar.gz）：
#   包内即 src/frontend/dist 的内容（包根直接含 index.html、assets/ 等），
#   解包到本文件 root 指定的目录，使 /var/www/vestt/index.html 存在：
#     sudo mkdir -p /var/www/vestt
#     sudo tar -xzf vestt-web-v<ver>.tar.gz -C /var/www/vestt
#   升级版本时建议先清空目录再解包（文件名带内容 hash，残留无害但会累积）。
#
# 启用方式：
#   sudo cp install/nginx/vestt.conf /etc/nginx/conf.d/vestt.conf   # 或 sites-available + 软链
#   sudo nginx -t && sudo systemctl reload nginx
#
# basepathoverride：后端以 --basepathoverride /vestt 运行时，本文件无需路径改写
# （location / 原样透传完整 URI，后端 middleware 自行剥离前缀）；前端资源为相对
# 路径引用（vite base: './'），可直接沿用本配置。
#
# 注意：本配置未在本机经 nginx -t 校验（验证环境无 nginx），启用前请先执行
# sudo nginx -t。
# =============================================================================

server {
    listen 80;
    server_name _;

    # = src/frontend/dist 构建产物（vestt-web-v<ver>.tar.gz 解包位置，见文件头说明）
    root /var/www/vestt;
    index index.html;

    access_log /var/log/nginx/vestt.access.log;
    error_log  /var/log/nginx/vestt.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 带内容 hash 的构建产物可长缓存（vite 输出 assets/<name>-<hash>.js）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 静态命中直出；未命中一律反代后端：
    # /UI/*（含 logout 302）、/api/*、/dl /img /bh、/health 行为与形态 A 完全一致
    location / {
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass http://127.0.0.1:9117;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # 供 Secure Cookie / 协议推断
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        # /dl（代理下载）为潜在的大文件流式响应，关闭缓冲边收边发
        proxy_buffering off;
    }
}
